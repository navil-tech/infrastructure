log_format navil_json escape=json
    '{"time":$msec,"requestTime":$request_time,"requestId":"$request_id","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"userAgent":"$http_user_agent",'
    '"referer":"$http_referer","secFetchDest":"$http_sec_fetch_dest"}';

server {
    listen 80;
    server_name navil.co.il www.navil.co.il;

    access_log /var/log/nginx/navil.access.log navil_json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
